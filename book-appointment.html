<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Book Appointment | MedAppoint</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="layout">
<aside class="sidebar"><div class="logo">✚ MedAppoint</div><nav>
<a href="index.html">▦ Dashboard</a><a href="appointment.html">▣ Appointments</a><a href="doctors.html">⚕ Find Doctors</a><a class="active" href="book-appointment.html">＋ Book Appointment</a><a href="reminders.html">◷ Reminders</a><a href="calendar.html">▦ Calendar</a><a href="history.html">▤ History</a>
</nav></aside>
<main>
<header class="topbar"><div><h1>Book Appointment</h1><p class="muted">Enter your details to schedule a visit.</p></div><div class="profile">👤 Patient Portal</div></header>
<section class="form-section">
<h2>Appointment Form</h2>
<form id="bookingForm">
<div class="form-grid">
<div class="form-group"><label for="patient">Patient Name</label><input type="text" id="patient" required></div>
<div class="form-group"><label for="age">Age</label><input type="number" id="age" min="1" max="120" required></div>
<div class="form-group"><label for="phone">Phone Number</label><input type="tel" id="phone" pattern="[0-9]{10}" maxlength="10" required></div>
<div class="form-group"><label for="email">Email</label><input type="email" id="email" required></div>
<div class="form-group"><label for="doctor">Select Doctor</label><select id="doctor" required><option value="">Choose Doctor</option><option>Dr. Priya Sharma</option><option>Dr. Rahul Mehta</option><option>Dr. Ananya Gupta</option><option>Dr. Arjun Kapoor</option><option>Dr. Neha Verma</option></select></div>
<div class="form-group"><label for="clinic">Clinic</label><input type="text" id="clinic" readonly required></div>
<div class="form-group"><label for="date">Appointment Date</label><input type="date" id="date" required></div>
<div class="form-group"><label for="time">Appointment Time</label><input type="time" id="time" required></div>
<div class="form-group full"><label for="reason">Reason for Appointment</label><textarea id="reason" rows="3" required></textarea></div>
<div class="form-group"><label for="reminder">Reminder Preference</label><select id="reminder"><option value="1 day before">1 Day Before</option><option value="2 hours before">2 Hours Before</option><option value="No reminder">No Reminder</option></select></div>
<div class="form-group"><label for="recurring">Recurring Appointment</label><select id="recurring"><option value="No">No</option><option value="Weekly">Weekly</option><option value="Monthly">Monthly</option></select></div>
</div>
<button class="submit-btn" type="submit">Confirm Appointment</button>
</form></section><footer>© 2026 MedAppoint</footer>
</main></div><script src="app.js"></script></body></html>
